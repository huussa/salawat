<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>مواقيت الصلاة</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-gray-950 text-white">
    <main class="min-h-screen flex flex-col justify-center px-4 py-6">
      <!-- dates -->
      <section class="text-center mb-8">
        <h1
          id="hijri-date"
          class="text-3xl sm:text-4xl font-bold mb-2"
        >
          جاري التحميل...
        </h1>

        <p
          id="gregorian-date"
          class="text-2xl sm:text-3xl"
        >
        </p>
      </section>

      <!-- prayes timings -->
      <section
        id="prayer-times"
        class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5 max-w-5xl w-full mx-auto"
      >
      </section>
    </main>

    <script>
      const hijriDate = document.querySelector("#hijri-date");
      const gregorianDate = document.querySelector("#gregorian-date");
      const prayerTimes = document.querySelector("#prayer-times");

      const prayers = [
        {
          name: "الفجر",
          key: "Fajr",
        },
        {
          name: "الشروق",
          key: "Sunrise",
        },
        {
          name: "الظهر",
          key: "Dhuhr",
        },
        {
          name: "العصر",
          key: "Asr",
        },
        {
          name: "المغرب",
          key: "Maghrib",
        },
        {
          name: "العشاء",
          key: "Isha",
        },
      ];

      const months = {
        "January": "يناير",
        "February": "فبراير",
        "March": "مارس",
        "April": "أبريل",
        "May": "مايو",
        "June": "يونيو",
        "July": "يوليو",
        "August": "أغسطس",
        "September": "سبتمبر",
        "October": "أكتوبر",
        "November": "نوفمبر",
        "December": "ديسمبر",
      }
      const getPrayerTimes = async () => {
        try {
          const response = await fetch(
            "https://api.aladhan.com/v1/timingsByCity?city=Taif&country=SA&method=4",
          );

          const data = await response.json();

          const timings = data.data.timings;
          const date = data.data.date;

          // hijre date
          hijriDate.textContent = `${date.hijri.day} ${date.hijri.month.ar} ${date.hijri.year}`;

          // date
          gregorianDate.textContent = `${date.gregorian.day} ${months[date.gregorian.month.en]} ${date.gregorian.year}`;

          // create prayes cards
          prayers.forEach((prayer) => {
            const card = document.createElement("div");

            card.className = `
                        border border-gray-700
                        rounded-2xl
                        bg-gray-900
                        p-5
                        sm:p-7
                        text-center
                        flex flex-col
                        items-center
                        justify-center
                        min-h-36
                        sm:min-h-44
                    `;

            card.innerHTML = `
                        <h2 class="text-2xl sm:text-3xl font-bold mb-3">
                            ${prayer.name}
                        </h2>

                        <p class="text-4xl sm:text-5xl font-black tracking-wide">
                            ${timings[prayer.key]}
                        </p>
                    `;

            prayerTimes.appendChild(card);
          });
        } catch (error) {
          hijriDate.textContent = "حدث خطأ";

          gregorianDate.textContent = "تعذر تحميل مواقيت الصلاة";

          console.error(error);
        }
      };

      getPrayerTimes();
    </script>
  </body>
</html>
